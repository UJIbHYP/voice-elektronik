# ==============================================================
# Elektronic Android — Таблица голосовых команд
# ==============================================================
# Формат: регулярное_выражение_или_фраза = shell_команда
# Префикс из giga.conf (например "андроид") автоматически отсекается перед проверкой.

# Перезагрузка и выключение
перезагрузи телефон=reboot
перезагрузить телефон=reboot
перезагрузка=reboot
перезагрузи в рекавери=reboot recovery
перезагрузи в бутлоадер=reboot bootloader
выключи телефон=reboot -p

# Громкость
громче=cmd media_session volume --show --adj raise
повысь громкость=cmd media_session volume --show --adj raise
прибавь громкость=cmd media_session volume --show --adj raise
тише=cmd media_session volume --show --adj lower
понизь громкость=cmd media_session volume --show --adj lower
убавь громкость=cmd media_session volume --show --adj lower
выключи звук=cmd media_session volume --show --adj lower; cmd media_session volume --show --adj lower; cmd media_session volume --show --adj lower
без звука=cmd media_session volume --show --adj lower; cmd media_session volume --show --adj lower; cmd media_session volume --show --adj lower
максимальная громкость=cmd media_session volume --show --adj raise; cmd media_session volume --show --adj raise; cmd media_session volume --show --adj raise

# Фонарик
включи фонарик=am broadcast -a miui.intent.action.TOGGLE_TORCH --ez miui.intent.extra.IS_ENABLE true 2>/dev/null || cmd flashlight on
зажги фонарик=am broadcast -a miui.intent.action.TOGGLE_TORCH --ez miui.intent.extra.IS_ENABLE true 2>/dev/null || cmd flashlight on
выключи фонарик=am broadcast -a miui.intent.action.TOGGLE_TORCH --ez miui.intent.extra.IS_ENABLE false 2>/dev/null || cmd flashlight off
погаси фонарик=am broadcast -a miui.intent.action.TOGGLE_TORCH --ez miui.intent.extra.IS_ENABLE false 2>/dev/null || cmd flashlight off
фонарик=am broadcast -a miui.intent.action.TOGGLE_TORCH --ez miui.intent.extra.IS_TOGGLE true 2>/dev/null || cmd flashlight toggle
переключи фонарик=am broadcast -a miui.intent.action.TOGGLE_TORCH --ez miui.intent.extra.IS_TOGGLE true 2>/dev/null || cmd flashlight toggle

# Снимок экрана
сделай скриншот=input keyevent 120
сделай скриншот экрана=input keyevent 120
сделай снимок экрана=input keyevent 120
скриншот экрана=input keyevent 120
снимок экрана=input keyevent 120
скриншот=input keyevent 120

# Экран
заблокируй экран=input keyevent 26
выключи экран=input keyevent 26
погаси экран=input keyevent 26

# Беспроводные сети
включи вайфай=svc wifi enable
выключи вайфай=svc wifi disable
включи блютуз=svc bluetooth enable
выключи блютуз=svc bluetooth disable

# Управление медиа
пауза=input keyevent 85
продолжить=input keyevent 85
плей=input keyevent 85
следующий трек=input keyevent 87
следующая песня=input keyevent 87
предыдущий трек=input keyevent 88
предыдущая песня=input keyevent 88

# Управление приложениями через системные intents
открой загрузки=am start -a android.intent.action.VIEW -d content://downloads/all_downloads
открой контакты=am start -a android.intent.action.VIEW -d content://contacts/people
открой календарь=am start -a android.intent.action.MAIN -c android.intent.category.APP_CALENDAR
открой калькулятор=am start -a android.intent.action.MAIN -c android.intent.category.APP_CALCULATOR
открой телефон=am start -a android.intent.action.DIAL
открой сообщения=am start -a android.intent.action.MAIN -c android.intent.category.APP_MESSAGING
открой галерею=am start -a android.intent.action.MAIN -c android.intent.category.APP_GALLERY
открой телеграм=monkey -p org.telegram.messenger 1
открой ватсап=monkey -p com.whatsapp 1
открой браузер=am start -a android.intent.action.VIEW -d https://google.com
открой камеру=am start -a android.media.action.STILL_IMAGE_CAMERA

# Режим не беспокоить
включи не беспокоить=cmd notification set_dnd on
выключи не беспокоить=cmd notification set_dnd off

# Root-диагностика
root статус=su -c 'id'
покажи SELinux=su -c 'getenforce'
список подключенных накопителей=su -c 'mount | grep -E "/data|/storage"'
проверь ошибки ядра=su -c 'dmesg -T | tail -n 80'
температуры датчиков=su -c 'for z in /sys/class/thermal/thermal_zone*; do [ -r "$z/temp" ] && printf "%s: " "$z" && cat "$z/temp"; done'
состояние cpu=su -c 'for f in /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq /sys/devices/system/cpu/cpu0/cpufreq/scaling_max_freq; do [ -r "$f" ] && echo "$f: $(cat "$f")"; done'

# Termux
открой термукс=am start -n com.termux/.app.TermuxActivity
запусти диагностику термукс=su -c '/data/data/com.termux/files/usr/bin/bash /data/data/com.termux/files/home/bin/diagnostics.sh'
состояние батареи термукс=su -c '/data/data/com.termux/files/usr/bin/termux-battery-status'
состояние вайфая термукс=su -c '/data/data/com.termux/files/usr/bin/termux-wifi-connectioninfo'
