# ==============================================================
# Elektronic Android (Электроник) — Файл конфигурации
# ==============================================================

# Клавиша активации (по умолчанию 114 — KEY_VOLUMEDOWN)
TRIGGER_KEYCODE=114

# Время удержания клавиши для активации записи (в миллисекундах)
# Короткие нажатия (< 300 мс) работают как обычное изменение громкости
TRIGGER_HOLD_MS=300

# Количество вычислительных потоков ONNX Runtime
# Для 8-ядерных CPU (big.LITTLE) рекомендуется 2 для работы на производительных ядрах
INFERENCE_THREADS=2

# Тактильный виброотклик при старте и завершении записи (1 - вкл, 0 - выкл)
HAPTIC_FEEDBACK=1

# Восстанавливать громкость после зажатия кнопки вниз (1 - да, 0 - нет)
RESTORE_VOLUME=1

# Способ записи звука:
#   auto        - автоопределение (app_process AudioRecord или tinycap)
#   app_process - через встроенный Android AudioRecord API (рекомендуется)
#   tinycap     - через утилиту tinycap
RECORDING_METHOD=auto

# Режим работы движка распознавания:
#   local_server - локальный HTTP-сервер Elektronic (модель постоянно в ОЗУ, мгновенно)
#   local_cli    - запуск утилиты pisar на каждый запрос
#   remote       - удалённый сервер в локальной сети Wi-Fi (например, ПК)
STT_MODE=local_server

# Адрес локального или удалённого сервера
SERVER_HOST=127.0.0.1
SERVER_PORT=8737

# Путь к локальной модели GigaAM v3 ONNX
MODEL_DIR=/data/adb/modules/giga_pisar_android/model

# Путь к интерпретатору Python (auto - автоматический поиск в Termux и системе)
PYTHON_BIN=auto

# Обработка голосовых команд (1 - включено, 0 - только диктовка текста)
COMMANDS_ENABLED=1

# Обязательный префикс для голосовых команд (например: андроид, android, электроник)
# Оставьте пустым, чтобы выполнять команды без префикса (например: перезагрузи телефон)
COMMAND_PREFIX=андроид

# Автоматическая вставка распознанного текста в активное поле (1 - да, 0 - только буфер обмена)
AUTO_PASTE=1

# Автоматически отправлять сообщение (нажатие Enter) после вставки (1 - да, 0 - нет)
AUTO_ENTER=0

# Логирование работы демона (1 - включено в /data/local/tmp/giga_pisar.log, 0 - выключено)
DEBUG_LOG=1
